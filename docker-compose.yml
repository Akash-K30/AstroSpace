services:
  redis:
    image: redis:7-alpine
    container_name: astrospace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: browse keys/TTLs at http://localhost:8081 while developing
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: astrospace-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  redis-data:
